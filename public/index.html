<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Sistem Penilaian Mahasiswa</h1>
            <p>Kelola data mahasiswa dan nilai dengan mudah</p>
        </header>

        <!-- Form Tambah Mahasiswa -->
        <section class="card">
            <h2>➕ Tambah Mahasiswa Baru</h2>
            <form id="formMahasiswa">
                <div class="form-group">
                    <label for="nim">NIM (10 digit):</label>
                    <input type="text" id="nim" placeholder="Contoh: 1234567890" required maxlength="10">
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" placeholder="Contoh: John Doe" required>
                </div>
                <div class="form-group">
                    <label for="jurusan">Jurusan:</label>
                    <input type="text" id="jurusan" placeholder="Contoh: Teknik Informatika" required>
                </div>
                <button type="submit" class="btn btn-primary">Simpan Mahasiswa</button>
            </form>
        </section>

        <!-- Daftar Mahasiswa -->
        <section class="card">
            <h2>👥 Daftar Mahasiswa</h2>
            <div class="table-container">
                <table id="tableMahasiswa">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Jurusan</th>
                            <th>GPA</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMahasiswa">
                        <tr>
                            <td colspan="6" class="text-center">Belum ada data mahasiswa</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Top Students -->
        <section class="card">
            <h2>🏆 Top 5 Mahasiswa</h2>
            <div id="topStudents" class="top-students">
                <p class="text-center">Belum ada data</p>
            </div>
        </section>
    </div>

    <!-- Modal Tambah Nilai -->
    <div id="modalNilai" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>📝 Tambah Nilai</h2>
            <form id="formNilai">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label>Mahasiswa:</label>
                    <p id="studentInfo" class="student-info"></p>
                </div>
                <div class="form-group">
                    <label for="mataKuliah">Mata Kuliah:</label>
                    <input type="text" id="mataKuliah" placeholder="Contoh: Basis Data" required>
                </div>
                <div class="form-group">
                    <label for="nilai">Nilai (0-100):</label>
                    <input type="number" id="nilai" min="0" max="100" placeholder="Contoh: 85" required>
                </div>
                <button type="submit" class="btn btn-primary">Simpan Nilai</button>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
